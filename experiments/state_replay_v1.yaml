# Only real, freely retrievable, point-in-time-eligible variables admitted by
# research/state_panel_contract_v1.yaml. No synthetic observations or imputation.
features:
  - hicp_yoy
  - industrial_production_yoy
  - unemployment_rate
  - deposit_facility_rate

n_states: 2
minimum_training_events: 40
restarts: 6
max_iterations: 150
tolerance: 0.000001
variance_floor: 0.05
transition_prior: 0.5
random_seed: 90210

# Frozen screening gates for this benchmark. These are not causal-effect power
# guarantees and cannot justify opening transmission outcomes.
minimum_hard_count: 20
minimum_weighted_ess: 30.0
maximum_mean_entropy: 0.60
minimum_restart_agreement: 0.85
