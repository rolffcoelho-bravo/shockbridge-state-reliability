candidate_panels:
  - panel_id: P0_CORE_REPLAY_AND_FAST
    series_ids:
      - RTD_HICP
      - RTD_INDUSTRIAL_PRODUCTION
      - RTD_UNEMPLOYMENT
      - ECB_DEPOSIT_FACILITY_RATE
      - ECB_YIELD_CURVE_2Y
      - ECB_YIELD_CURVE_10Y
      - ECB_USD_EUR_REFERENCE_RATE
    required_distinct_channels: 5
  - panel_id: P1_AUGMENTED_BANK_CREDIT
    extends: P0_CORE_REPLAY_AND_FAST
    additional_series_ids:
      - MIR_NFC_COST_OF_BORROWING
      - BSI_NFC_ADJUSTED_LOANS
      - BSI_MONETARY_AGGREGATE_M3
    required_distinct_channels: 7

pilot_success_rule: >-
  Both candidate panels must resolve to distinct nonempty series sets, cover
  their declared minimum channel counts, and contain only machine-verified
  replay or release-lag series. CISS is a classification control and cannot
  satisfy panel success. A current official history without usable historical
  release evidence remains release-lag or forward-only.
