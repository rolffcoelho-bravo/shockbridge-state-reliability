panels:
  - panel_id: P0_CORE_REPLAY_AND_FAST
    role: primary_replay_anchor
    series_ids:
      - RTD_HICP
      - RTD_INDUSTRIAL_PRODUCTION
      - RTD_UNEMPLOYMENT
      - ECB_DEPOSIT_FACILITY_RATE
      - ECB_YIELD_CURVE_2Y
      - ECB_YIELD_CURVE_10Y
      - ECB_USD_EUR_REFERENCE_RATE
    minimum_distinct_channels: 5
  - panel_id: P1_AUGMENTED_BANK_CREDIT
    role: revision_exposed_augmented_sensitivity
    series_ids:
      - RTD_HICP
      - RTD_INDUSTRIAL_PRODUCTION
      - RTD_UNEMPLOYMENT
      - ECB_DEPOSIT_FACILITY_RATE
      - ECB_YIELD_CURVE_2Y
      - ECB_YIELD_CURVE_10Y
      - ECB_USD_EUR_REFERENCE_RATE
      - MIR_NFC_COST_OF_BORROWING
      - BSI_NFC_ADJUSTED_LOANS
      - BSI_MONETARY_AGGREGATE_M3
    minimum_distinct_channels: 7

scientific_language:
  executed_panel_label: wider_multichannel_panel
  high_dimensional_claim_allowed_before_execution: false
  condition_for_later_high_dimensional_language: >-
    Report the executed nonredundant cross section, time span, missingness,
    selected factor rank, effective channel count, and scenario count first;
    ten registered series alone do not establish a high-dimensional result.
