structural_audit_before_freeze:
  finding: >-
    Identifier semantics are not uniform across all archive links. Modern
    ecb.mir identifiers can encode a release month or date rather than the
    reference period. Only the exact legacy PDF path grammars below are
    eligible. Broad mirYYMM or mdYYMM substring parsing is prohibited.
  explicit_title_cross_validation_in_bound_bytes:
    MIR:
      eligible_entries_with_explicit_reference_title: 20
      identifier_title_agreements: 20
      disagreements: 0
    BSI:
      eligible_entries_with_explicit_reference_title: 17
      identifier_title_agreements: 17
      disagreements: 0
  evidentiary_role: >-
    These counts justify freezing a narrow parser. They are structural evidence
    from already preserved archive indexes, not an empirical state or outcome
    result.

archive_entry_contract:
  entry_association: >-
    Associate one dt element's ISO date with only the immediately following dd
    title container. Do not search an arbitrary preceding token window.
  release_date_source: dt_isoDate_attribute
  release_date_validation:
    - valid_ISO_calendar_date
    - visible_date_text_must_agree_when_present
    - one_release_date_per_entry
  href_normalization: strip_query_only
  reference_year_resolution: >-
    Decode YY against the associated release year. The unique admissible full
    year must equal either the release year or the immediately preceding year.
    Any other century or year relation fails closed.
  reference_period_validation:
    - month_is_01_through_12
    - reference_month_end_strictly_precedes_release_date
    - duplicate_reference_periods_must_have_identical_release_dates

identifier_grammars:
  MIR:
    exact_path_regex: '^/press/pdf/mfi/mir(?P<yy>[0-9]{2})(?P<mm>0[1-9]|1[0-2])\.pdf$'
    generic_title_exact: MFI interest rate statistics
    explicit_title_prefixes:
      - 'MFI interest rate statistics:'
      - 'Euro area bank interest rate statistics:'
    modern_ecb_mir_paths_eligible: false
  BSI:
    exact_path_regex: '^/press/pdf/md/(?:ecb\.)?md(?P<yy>[0-9]{2})(?P<mm>0[1-9]|1[0-2])(?:\.en)?\.pdf$'
    generic_title_exact: Monetary developments in the euro area
    explicit_title_prefixes:
      - 'Monetary developments in the euro area:'
    annex_or_table_paths_eligible: false
  common_fail_closed_rules:
    - explicit_title_period_must_equal_identifier_period
    - unrecognized_title_is_ineligible
    - partial_identifier_match_is_ineligible
    - query_parameters_cannot_supply_semantics
    - malformed_or_conflicting_entry_aborts_the_build

release_mapping_contract:
  merge_rule: >-
    Preserve every Run 023 explicit title mapping. Add an identifier mapping
    only when the archive entry satisfies the complete eligible grammar and
    validation contract. Identical mappings may overlap; conflicting mappings
    abort the run.
  minimum_cross_validation_support:
    MIR: 20
    BSI: 17
  required_cross_validation_disagreements:
    MIR: 0
    BSI: 0
  sample_reference_period_start: 2003-01
  sample_reference_period_end: 2025-10

timing_variants:
  registered_clock:
    label: release_date_at_10_00_01_Europe_Berlin
    rule: combine_release_date_with_10_00_01_local
    evidentiary_status: preregistered_calendar_convention_not_document_level_time
  next_day_clock:
    label: next_calendar_day_at_00_00_00_Europe_Berlin
    rule: combine_release_date_plus_one_calendar_day_with_00_00_00_local
    evidentiary_status: conservative_sensitivity_not_claimed_actual_release_time
  admissibility: usable_timestamp_strictly_before_monthly_origin
  monthly_origin: first_calendar_day_23_59_59_Europe_Berlin

rebuild_contract:
  panel_start: 2003-01
  panel_end: 2025-10
  panels:
    - P0_CORE_REPLAY_AND_FAST
    - P1_AUGMENTED_BANK_CREDIT
  all_non_MIR_BSI_source_values_and_transformations: identical_to_bound_run_023
  raw_directory: data/raw/run023_full_panel_v1
  output_directory: data/processed/run024_archive_timing_v1
  immutable_output: true
  required_outputs:
    - registered_clock/p0_core_replay_and_fast.csv
    - registered_clock/p1_augmented_bank_credit.csv
    - registered_clock/release_calendar.csv
    - next_day_clock/p0_core_replay_and_fast.csv
    - next_day_clock/p1_augmented_bank_credit.csv
    - next_day_clock/release_calendar.csv

comparison_contract:
  compare_registered_clock_against_run_023:
    - release_mapping_count_delta_by_kind
    - observed_origin_delta_by_series
    - fully_observed_origin_delta_by_panel
    - changed_panel_key_count
    - first_usable_origin_by_series
  compare_next_day_against_registered_clock:
    - release_dates_coinciding_with_origin_date
    - changed_release_timestamp_count
    - changed_panel_key_count
    - missingness_status_change_count
    - transformed_value_change_count
    - fully_observed_origin_delta_by_panel
    - exact_changed_origin_months
  invariants:
    - exact_registered_row_count_per_panel
    - zero_duplicate_keys
    - zero_nonfinite_transformed_values
    - zero_point_in_time_violations
    - source_response_hashes_unchanged
    - no_outcome_or_reliability_engine_access

stop_rules:
  - Stop if any bound input byte count or SHA-256 differs.
  - Stop if an explicit title disagrees with its eligible identifier.
  - Stop if cross-validation support falls below the frozen minimum.
  - Stop if a generic entry requires sequence, average-lag, or neighbouring-entry inference.
  - Stop if either timing variant violates the strict decision-time clock.
  - Stop before reliability fitting regardless of coverage improvement.

reporting_contract:
  preserve_run_023_unchanged: true
  label_run_024_as_post_coverage_approved_amendment: true
  manuscript_next_version: research/paper/manuscript_v1_10.md
  prohibit_claims:
    - validated_reliable_state
    - useful_authorization_rate
    - methodological_novelty_established
    - high_dimensional_empirical_result
    - transmission_effect
    - monetary_policy_recommendation

next_gate_after_run_024:
  owner_approval_required: true
  default: >-
    Report the amendment and sensitivity, then stop. Reliability-envelope
    fitting requires a separately frozen execution protocol and new approval.
