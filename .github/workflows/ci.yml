name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            locked: true
          - python-version: "3.12"
            locked: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.lock
      - if: ${{ matrix.locked }}
        run: |
          python -m pip install -r requirements/build-py39.lock
          python -m pip install -r requirements/dev-py39.lock
          python -m pip install --no-deps -e .
      - if: ${{ matrix.locked == false }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - run: make quality
      - run: make test-public
      - run: make synthetic

  compatibility-ubuntu-26:
    runs-on: ubuntu-26.04
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.lock
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - run: make quality
      - run: make test-public
      - run: make synthetic
