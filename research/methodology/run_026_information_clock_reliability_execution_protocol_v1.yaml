schema_version: 1
protocol_id: run-026-information-clock-reliability-execution-v1
created_on: 2026-10-16
status: APPROVED_AND_FROZEN_BEFORE_EMPIRICAL_RELIABILITY_EXECUTION
owner_approval: recorded_2026-10-16

research_question: >-
  Does an outcome-blind reliability certificate built over defensible official
  ECB information clocks authorize a nondegenerate macro-financial state at
  useful participation, and does it improve future internal measurement
  reliability relative to the preregistered single-panel and robust
  comparators?

approved_scope: >-
  Freeze and preflight the first real-data reliability execution over all four
  Run 025 source-clock labels. Do not fit the empirical state, reveal the
  one-time evaluation results, inspect a transmission outcome, or revise a
  threshold in Run 026 protocol-freeze work. Empirical execution requires the
  next separately recorded owner approval.

scientific_boundary:
  real_official_data_only: true
  zero_cost_sources_only: true
  new_network_retrieval_allowed: false
  preserved_hash_bound_panels_only: true
  synthetic_empirical_observations_allowed: false
  software_fixture_values_allowed_for_tests_only: true
  software_fixture_values_are_empirical_evidence: false
  empirical_reliability_fit_allowed_during_protocol_freeze: false
  evaluation_results_access_allowed_during_protocol_freeze: false
  transmission_outcomes_access_allowed: false
  transmission_module_import_allowed: false
  high_dimensional_empirical_claim_allowed: false
  methodological_novelty_claim_allowed: false
  monetary_policy_recommendation_allowed: false
  positive_result_required: false

