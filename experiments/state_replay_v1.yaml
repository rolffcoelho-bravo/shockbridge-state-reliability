schema_version: 1
experiment_id: state-replay-v1
evidence_status: REAL_DATA_OUTCOME_BLIND
estimator_role: EVENT_INDEXED_HMM_BENCHMARK

panel_path: data/processed/state_panel_v1.csv
panel_sha256: b3e15765a656009c369a1151959dd00eae072a01467f9641967d52403cb61079
