research_question: >-
  Can narrowly validated reference-period identifiers in the already preserved
  official ECB MIR and BSI archive indexes extend the conservative Run 023
  decision-time panels, and does replacing the registered within-day calendar
  convention with next-calendar-day availability change any monthly vintage?

