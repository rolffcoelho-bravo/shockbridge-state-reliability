stop_rules:
  - Stop if any bound input byte count or SHA-256 differs.
  - Stop if retrieval leaves the frozen ECB host or exceeds the response cap.
  - Stop if required page semantics or exactly one target table are absent.
  - Stop if any effective date or deposit-rate cell requires inference beyond the frozen parser.
  - Stop if exact cross-validation is below 100 percent or any required event is unmatched.
  - Stop without rebuilding panels if the source audit fails.
  - Stop if any non-DFR panel row changes.
  - Stop before reliability fitting regardless of the coverage result.

