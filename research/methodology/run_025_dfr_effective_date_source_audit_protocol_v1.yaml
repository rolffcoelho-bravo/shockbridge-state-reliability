canonical_source_contract:
  source_id: ECB_KEY_INTEREST_RATES_EFFECTIVE_DATE_TABLE
  provider: European Central Bank
  url: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/key_ecb_interest_rates/html/index.en.html
  required_final_host: www.ecb.europa.eu
  destination: data/raw/run025_dfr_effective_dates_v1/ecb_key_interest_rates.html
  atomic_download: true
  immutable_destination: true
  refuse_overwrite: true
  maximum_response_bytes: 5000000
  accepted_content_types:
    - text/html
  capture:
    - final_url
    - retrieved_at_utc
    - response_bytes
    - sha256
    - content_type
  required_visible_semantics:
    page_heading: Key ECB interest rates
    table_date_heading: Date (with effect from)
    value_heading: Deposit facility
    unit_text: interest rate levels in percentages per annum
  official_semantic_rule: >-
    The table's date column is explicitly headed "Date (with effect from)".
    The pre-10-March-2004 qualification on the same page concerns when changes
    to main-refinancing-operation rates became effective; it does not replace
    the stated effective dates of the deposit standing facility.

parser_contract:
  table_selection: >-
    Select exactly one table containing both the frozen date and deposit-rate
    headings. Zero or multiple matching tables abort the run.
  year_rule: >-
    A four-digit year cell starts a year block. Empty year cells inherit only
    the immediately preceding valid year within the selected table. Any other
    year inference is prohibited.
  date_rule: >-
    Parse only a day plus an English month abbreviation from the date cell,
    after removing displayed footnote markers. The resulting calendar date
    must be valid and unique within the selected table.
  value_rule: >-
    Parse the deposit-facility cell as a finite decimal percentage per annum.
    Normalize Unicode minus to ASCII minus. A dash or blank is ineligible, not
    zero. Floating-point comparison is prohibited.
  target_event_window:
    first_required_baseline_date: 2002-12-06
    last_admissible_effective_date: 2025-10-31
  duplicate_rule: exact_date_and_value_duplicates_may_collapse_conflicts_abort
  ordering_rule: strictly_increasing_after_sort
  prohibited_methods:
    - interpolation
    - forward_or_backward_date_inference
    - average_lag_imputation
    - neighbouring_row_value_imputation
    - parsing_other_language_pages
    - treating_page_retrieval_time_as_historical_availability

cross_validation_contract:
  retained_series_key: FM.D.U2.EUR.4F.KR.DFR.LEV
  retained_period_field: TIME_PERIOD
  retained_value_field: OBS_VALUE
  retained_database_timestamp_fields_are_not_effective_dates:
    - VALID_FROM
    - VALID_TO
  comparison_window:
    start: 2002-12-06
    end: 2025-10-31
  expansion_rule: >-
    For each retained API calendar day, select the last official table event
    whose effective date is not later than that day. Compare normalized decimal
    values exactly; do not use a floating tolerance.
  acceptance_requirements:
    minimum_official_events_in_window: 30
    minimum_compared_api_days: 8000
    exact_value_agreement_percent: 100
    conflicting_days: 0
    unmatched_api_days: 0
    unmatched_effective_events: 0
  semantics_required_for_acceptance:
    - official_page_identifies_provider_and_rate
    - official_page_labels_dates_as_effective
    - retained_api_title_contains_date_of_changes_raw_data
    - retained_api_unit_is_percent_per_annum

timing_variants:
  effective_day_clock:
    label: official_effective_date_at_00_00_00_Europe_Berlin
    rule: combine_official_effective_date_with_local_midnight
    evidentiary_status: official_date_in_force_within_the_calendar_day
  conservative_next_day_clock:
    label: next_calendar_day_at_00_00_00_Europe_Berlin
    rule: combine_official_effective_date_plus_one_calendar_day_with_local_midnight
    evidentiary_status: conservative_intraday_sensitivity_not_claimed_actual_effective_time
  admissibility: usable_timestamp_strictly_before_monthly_origin
  monthly_origin: first_calendar_day_23_59_59_Europe_Berlin

