schema_version: 1
protocol_id: run-025-dfr-effective-date-source-audit-v1
created_on: 2026-10-16
status: APPROVED_AND_FROZEN_AFTER_LOCATOR_INSPECTION_BEFORE_CANONICAL_RETRIEVAL_OR_REBUILD
owner_approval: recorded_2026-10-16

research_question: >-
  Does the ECB's independently published key-interest-rate table provide a
  defensible effective-date clock for the deposit-facility rate that removes
  the artificial pre-2015 gap created by treating a database maintenance
  timestamp as economic availability, while remaining exactly consistent with
  the already retained official ECB daily series?

design_stage_disclosure: >-
  The official ECB locator and rendered table were inspected on 2026-10-16 to
  establish the source semantics and a feasible parser before this protocol
  was frozen. The table heading and historical values were therefore visible
  during design. No canonical response was retained, no panel was rebuilt, no
  reliability model was fitted, and no transmission outcome was accessed
  before freeze. Run 025 is prospective with respect to canonical retrieval,
  byte hashes, parser execution, acceptance, and all panel comparisons, but is
  not represented as blinded source discovery.

