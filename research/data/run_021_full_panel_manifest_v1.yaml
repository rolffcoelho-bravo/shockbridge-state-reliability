schema_version: 1
manifest_id: run-021-full-panel-manifest-v1
created_on: 2026-10-14
status: FROZEN_BEFORE_FULL_RETRIEVAL
amends: null
provider: European Central Bank
service: ECB Data Portal SDMX API
service_root: https://data-api.ecb.europa.eu/service/data
rights_locator: https://www.ecb.europa.eu/stats/ecb_statistics/governance_and_quality_framework/html/usage_policy.en.html
real_official_data_only: true
zero_cost_sources_only: true
synthetic_empirical_observations_allowed: false
transmission_outcomes_allowed: false

retrieval_contract:
  retrieval_allowed_in_run_021: false
  next_stage_requires_separate_owner_approval: true
  atomic_download: true
  immutable_destination: data/raw/run021_full_panel_v1
  maximum_response_bytes_per_series: 50000000
  response_hash_state_before_retrieval: PENDING_NOT_INVENTED
  hash_algorithm_after_retrieval: sha256
  capture_final_url_and_utc_timestamp: true
  refuse_redirect_off_official_host: true
  refuse_overwrite: true

calendar:
  raw_lookback_start: 2002-01-01
  panel_start: 2003-01
  panel_end: 2025-10
  monthly_origin: first_calendar_day_23_59_59_Europe_Berlin
  availability_rule: first_usable_timestamp_strictly_before_origin
  equality_at_origin: rejected

release_sources:
  rtd_information: https://data.ecb.europa.eu/data/datasets/RTD/data-information
  fx_methodology: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html
  mir_calendar: https://www.ecb.europa.eu/press/calendars/statscal/mfm/html/stprmf.en.html
  mir_archive: https://www.ecb.europa.eu/press/stats/mfi/html/index.en.html
  bsi_calendar: https://www.ecb.europa.eu/press/calendars/statscal/mfm/html/stprmp.en.html
  bsi_information: https://data.ecb.europa.eu/data/datasets/BSI/data-information
  rule: >-
    Release-calendar pages and any historical release index used in the build
    must be stored privately and hash-registered before series values are
    transformed. If an exact MIR or BSI reference-period release cannot be
    verified, that series-month remains missing.

series:
  - series_id: RTD_HICP
    full_series_key: RTD.M.S0.N.P_C_OV.X
    api_path: RTD/M.S0.N.P_C_OV.X
    filename: rtd_hicp.csv
    frequency: M
    unit: IX
    channel: prices_and_expectations
    timing_class: A_REPLAY_ELIGIBLE
    revision_exposure: archived_policy_concept_vintages
    availability_algorithm: latest_row_with_VALID_FROM_strictly_before_origin
    transformation: yoy_log_difference_times_100_within_selected_vintage
    sign: 1
    transformation_lookback_periods: 12
    query_url: https://data-api.ecb.europa.eu/service/data/RTD/M.S0.N.P_C_OV.X?includeHistory=true&format=csvdata&startPeriod=2002-01&endPeriod=2025-10
    response_sha256: PENDING_NOT_INVENTED

  - series_id: RTD_INDUSTRIAL_PRODUCTION
