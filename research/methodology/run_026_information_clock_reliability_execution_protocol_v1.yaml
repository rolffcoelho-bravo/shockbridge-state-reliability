analytic_equivalence_contract:
  purpose: >-
    Distinguish provenance clocks from independent numerical information sets.
    Timestamp-only differences retain their provenance labels but contribute
    one analytic path and one weight after exact deduplication.
  canonical_fields:
    - origin_month
    - series_id
    - observation_period
    - transformed_value
    - is_missing
    - missing_reason
  excluded_provenance_fields:
    - panel_id
    - origin_timestamp
    - usable_timestamp
    - source_response_sha256
  exact_class_count_before_model_scenario_generation: 3
  expected_classes:
    - panel_id: P0_CORE_REPLAY_AND_FAST
      members:
        - registered_mir_bsi__effective_day_dfr
        - registered_mir_bsi__next_day_dfr
        - next_day_mir_bsi__effective_day_dfr
        - next_day_mir_bsi__next_day_dfr
    - panel_id: P1_AUGMENTED_BANK_CREDIT
      members:
        - registered_mir_bsi__effective_day_dfr
        - registered_mir_bsi__next_day_dfr
    - panel_id: P1_AUGMENTED_BANK_CREDIT
      members:
        - next_day_mir_bsi__effective_day_dfr
        - next_day_mir_bsi__next_day_dfr
  multiplicity_weight: one_per_exact_analytic_class
  uncertainty_resampling_axis: monthly_origins_only
  clock_labels_as_independent_draws: false
  provenance_mapping_retained_in_every_output: true

execution_clock_and_calendar:
  timezone: Europe/Berlin
  monthly_origin: first_calendar_day_23_59_59
  availability_operator: usable_timestamp_strictly_less_than_origin
  histories: [expanding, rolling_120_month]
  first_possible_geometry_origin: 2013-01
  calibration_start: 2013-01
  calibration_end: 2017-12
  embargo_start: 2018-01
  embargo_end: 2018-12
  evaluation_start: 2019-01
  evaluation_end: 2024-10
  diagnostic_tail_end: 2025-10
  future_failure_horizon_months: 12
  every_evaluation_label_matured: true
  evaluation_once_only: true
  transmission_outcomes_remain_sealed: true

model_scenario_generator:
  base_panel_family_counts:
    P0_CORE_REPLAY_AND_FAST: 6
    P1_AUGMENTED_BANK_CREDIT: 8
  family_scenarios: [full_panel, leave_one_available_channel_out]
  release_lag_policies:
    - observed_registered_source_clock
    - run021_class_B_plus_one_calendar_month_stress
  missingness_policies:
    - observed_ragged_edge
    - complete_case_common_window
  provenance_labeled_ceiling_before_deduplication: 224
  unique_analytic_ceiling_after_input_clock_deduplication: 88
  arithmetic: >-
    Provenance ceiling: (6 + 8) * 4 source-clock labels * 2 release-lag
    policies * 2 missingness policies = 224. Analytic ceiling after the frozen
    three-class input deduplication: (6 * 1 + 8 * 2) * 2 * 2 = 88.
  final_origin_specific_deduplication_key: >-
    exact eligibility mask plus standardized observed matrix SHA-256 using the
    frozen Run 022 canonicalization
  scenario_order: lexical_id
  prohibited:
    - duplicate_provenance_count_as_information_set_evidence
    - scenario_weighting_by_clock_multiplicity
    - scenario_selected_by_state_path
    - scenario_selected_by_authorization_rate
    - scenario_selected_by_evaluation_result
    - scenario_selected_by_transmission_result
    - dropping_run021_slow_release_stress_after_observing_panels

estimation_contract:
  engine: deterministic_channel_weighted_EM_PCA
  implementation: src/shockbridge_state_risk/state/reliability_engine.py
  standardization: observed_expanding_history_moments_only
  series_minimum_training_coverage: 0.80
  minimum_observations_per_retained_series: 24
  minimum_training_months: 60
  common_geometry_window_months: 120
  minimum_distinct_channels: 5
  candidate_ranks: [1, 2, 3]
  rank_rule: observed_entry_ICp2_adaptation
  fixed_rank_sensitivities: [1, 2]
  maximum_iterations: 1000
  relative_observed_loss_tolerance: 0.00000001
  nonconvergence: scenario_nondegenerate_false
  transformations_recomputed_with_future_data: prohibited
  backward_fill: prohibited
  interpolation: prohibited
  synthetic_imputation: prohibited

geometry_and_authorization:
  score_space: common_120_month_calendar_projector
  channel_space: frozen_eight_channel_projector
  alignment: training_only_orthogonal_Procrustes
  orientation_anchor: frozen_signed_eight_channel_direction
  envelope_statistics:
    - maximum_pairwise_score_projector_spectral_distance
    - maximum_pairwise_channel_projector_spectral_distance
    - minimum_absolute_anchor_cosine
    - aligned_state_score_minimum
    - aligned_state_score_first_quartile
    - aligned_state_score_median
    - aligned_state_score_third_quartile
    - aligned_state_score_maximum
  threshold_grid:
    score_projector_distance: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30]
    channel_projector_distance: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30]
    orientation_floor: [0.50, 0.60, 0.70, 0.80]
  authorize_only_if:
    - at_least_two_unique_nondegenerate_analytic_scenarios
    - every_within_panel_quality_gate_passes
    - every_cross_scenario_envelope_gate_passes
    - every_source_clock_provenance_label_maps_to_a_passing_analytic_class
  fewer_than_two_unique_scenarios: abstain
  provenance_duplicates_may_satisfy_two_scenario_rule: false

future_failure_label:
  reference_panel: P1_AUGMENTED_BANK_CREDIT
  reference_source_clock: registered_mir_bsi__effective_day_dfr
  reference_scenario: observed_registered_source_clock_observed_ragged_edge_full_panel
  one_month_breach_if_any:
    - score_projector_spectral_distance_greater_than_0.35
    - channel_projector_spectral_distance_greater_than_0.35
    - absolute_anchor_cosine_less_than_0.20
    - eligible_channel_count_less_than_5
    - estimator_or_rank_selection_nondegenerate_false
  label: any_one_month_breach_in_months_t_plus_1_through_t_plus_12
  candidate_envelope_thresholds_do_not_enter_label: true
  transmission_outcomes_do_not_enter_label: true

threshold_selection:
  calibration_only: true
  loss:
    false_authorization_cost: 1.0
    abstention_cost: 0.25
  deterministic_tie_break:
    - lower_loss
    - higher_participation
    - lower_distance_thresholds
    - higher_orientation_floor
  evaluation_reselection: prohibited
  post_evaluation_threshold_repair: prohibited

registered_comparators:
  - id: B0_ALWAYS_ABSTAIN
    implementation: authorize_no_origin
  - id: B1_SINGLE_AUGMENTED_PANEL
    implementation: >-
      Registered P1 under registered MIR/BSI and effective-day DFR clocks,
      observed ragged edges, and full-panel within-panel quality only.
  - id: B2_VINTAGE_PANEL_COMBINATION
    implementation: >-
      Equal-weight training-aligned scores across unique nondegenerate analytic
      classes; provenance duplicates receive zero additional weight.
  - id: B3_ROBUST_PCA
    implementation: >-
      Principal-component-pursuit sensitivity on the B1 information set with
      penalty frozen using calibration data only.

comparator_matching:
  matched_participation_rule: >-
    Freeze each cutoff using calibration data only and report evaluation
    contrasts both at that cutoff and at the nearest calibration participation
    to the envelope. Never rematch on evaluation results.

primary_metrics:
  - evaluation_decision_loss_difference_vs_B1
  - evaluation_future_failure_rate_difference_vs_B1_at_calibration_matched_participation
  - evaluation_participation_rate
  - evaluation_information_set_fragility_rate
  - evaluation_clock_robust_authorization_rate

primary_success_requires_all:
  - evaluation_participation_rate_at_least_0.10
  - at_least_two_unique_nondegenerate_analytic_scenarios_at_authorized_origins
  - decision_loss_strictly_lower_than_B1
  - future_failure_rate_not_higher_than_B1_at_calibration_matched_participation
  - authorization_is_invariant_across_all_four_provenance_clocks
  - no_invariance_or_negative_control_failure

inference:
  resampling: paired_non_circular_moving_blocks_over_evaluation_origins
  draws: 1999
  primary_block_months: 12
  sensitivity_block_months: [6, 18, 24]
  simultaneous_interval: maximum_absolute_studentized_statistic_across_primary_contrasts
  resample_source_clock_labels: false
  condition_on_selected_thresholds_and_observed_paths: true
  finite_sample_guarantee_claim: prohibited
  p_value_language_without_valid_test: prohibited

required_invariances:
  - scenario_input_order_has_no_effect
  - factor_rotation_has_no_effect
  - provenance_duplicate_has_no_effect_after_analytic_deduplication
  - repeated_identical_clock_label_has_zero_incremental_weight
  - exact_immutable_input_requery_has_zero_distance
  - serialization_is_byte_identical_in_locked_reproduction

negative_controls:
  - channel_labels_permuted_before_frozen_map
  - source_clock_labels_permuted_without_changing_analytic_paths
  - timing_scenario_cyclically_shifted_within_calibration_and_evaluation
  - evaluation_outcomes_replaced_by_calibration_block_permutation_for_test_harness_only

negative_control_interpretation:
  interpretation: >-
    Controls diagnose leakage, label dependence, and mechanical authorization;
    they do not prove causality, general optimality, or methodological novelty.

novelty_and_claim_safeguards:
  candidate_increment: >-
    A clock-robust authorization rule over an ambiguity set generated by
    auditable official information mechanics, evaluated in common calendar and
    economic-channel spaces with duplicate-neutral weighting and an outcome
    firewall.
  established_components_not_claimed_as_new:
    - principal_components_and_EM_PCA
    - ragged_edge_factor_models
    - Bai_Ng_information_criteria
    - projector_and_Procrustes_geometry
    - real_time_vintage_analysis
    - robust_PCA
    - model_uncertainty_and_robust_decisions
    - selective_prediction_and_abstention
    - block_bootstrap_inference
  novelty_language_requires_before_reconsideration:
    - systematic_primary_literature_update_through_execution_date
    - successful_registered_comparator_result
    - useful_nondegenerate_participation
    - robustness_to_all_source_clocks_and_negative_controls
    - independent_external_assessment
  prohibited_current_claims:
    - new_factor_estimator
    - formal_reliability_theory
    - high_dimensional_empirical_validation
    - methodological_novelty_established
    - transmission_effect
    - monetary_policy_recommendation

stop_rules:
  - stop_if_any_bound_input_byte_count_or_sha256_differs
  - stop_if_any_panel_key_is_duplicate_or_any_observed_value_is_nonfinite
  - stop_if_the_eight_files_do_not_collapse_to_exactly_three_frozen_analytic_classes
  - stop_if_a_provenance_label_is_lost_during_deduplication
  - stop_if_the_run021_slow_release_stress_is_not_implemented
  - stop_if_fewer_than_two_unique_nondegenerate_scenarios_exist
  - stop_and_report_non_improvement_if_participation_is_below_0.10
  - stop_and_report_non_improvement_if_primary_success_is_not_met
  - stop_if_any_transmission_module_or_outcome_is_accessed
  - keep_transmission_outcomes_sealed_until_a_separate_post_evaluation_authorization

required_protocol_freeze_outputs:
  - research/methodology/run_026_information_clock_reliability_execution_protocol_v1.yaml
  - src/shockbridge_state_risk/state/reliability_execution_contract.py
  - tests/test_reliability_execution_contract.py
  - reports/methodology/run_026_protocol_preflight.audit.json
  - reports/methodology/run_026_protocol_freeze_result_2026-10-16.md
  - reports/methodology/run_026_protocol_freeze_v1.manifest.yaml
  - research/paper/manuscript_v1_12.md
  - reports/methodology/run_026_manuscript_v1_12_claim_audit.yaml
  - reports/methodology/run_026_manuscript_v1_12_citation_locator_audit.yaml

next_decision:
  approval_required: true
  success: >-
    Request separate approval to implement the empirical execution harness and
    run the sealed reliability evaluation exactly once. Preserve the four
    provenance clocks, fit unique analytic paths once, and keep every
    transmission outcome inaccessible.
  failure: >-
    Preserve the failed preflight, amend prospectively, and do not fit any
    empirical state or inspect any evaluation or transmission result.
