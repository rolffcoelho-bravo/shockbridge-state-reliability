name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            locked: true
          - python-version: "3.12"
            locked: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/*.lock
      - if: ${{ matrix.locked }}
        run: |
          python -m pip install -r requirements/build-py39.lock
          python -m pip install -r requirements/dev-py39.lock
          python -m pip install --no-deps -e .
      - if: ${{ matrix.locked == false }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - run: make quality
      - run: make test-public
      - run: make synthetic
